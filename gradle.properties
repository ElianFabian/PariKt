# PariKt - Kotlin Multiplatform PARI/GP Library

# Select PARI/GP in parikt.properties (pari.version), independently of PariKt's version.
# GMP is pinned internally in parikt/native/build-native.sh; normally it does not need
# to change when selecting a different PARI version.

# Default ABIs for Android
# nativeAbis=arm64-v8a,x86_64

# Memory & JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX and dependency resolution
android.useAndroidX=true
android.dependency.useConstraints=false

# Code style
kotlin.code.style=official

# Use the npm bundled with Gradle-managed Node instead of downloading Yarn separately.
kotlin.js.yarn=false

# Native build runner: local (Linux/macOS), wsl (Windows)
# nativeRunner=local

# Force rebuild of native dependencies
# nativeForce=false
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Standard Linux run/test tasks cannot execute on Windows; runLinuxX64 and verifyLinuxX64 use WSL.
kotlin.native.ignoreDisabledTargets=true
# Share the same C bridge bindings and backend between Linux and Windows native source sets.
kotlin.mpp.enableCInteropCommonization=true
