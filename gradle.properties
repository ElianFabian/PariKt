# PariKt - Kotlin Multiplatform PARI/GP Library

# PARI/GP Version to build (tag from pari.git, e.g., pari-2.17.1, pari-2.15.0, or master)
pariVersion=2.17.1
# GMP is pinned internally in parikt/native/build-native.sh; normally it does not need
# to change when selecting a different PARI version.

# Default ABIs for Android
# nativeAbis=arm64-v8a,x86_64

# Memory & JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Modern AGP defaults & performance optimizations
android.useAndroidX=true
android.dependency.excludeLibraryComponentsFromConstraints=true

# Enable AGP 9+ Kotlin DSL features - DISABLED to avoid plugin conflicts
android.builtInKotlin=false
android.newDsl=false

# Code style
kotlin.code.style=official

# Native build runner: local (Linux/macOS), wsl (Windows)
# nativeRunner=local

# Force rebuild of native dependencies
# nativeForce=false
