name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to submit. Leave empty for a signed preview.
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: central-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      verified_run: ${{ steps.verification.outputs.run_id }}
    steps:
      - id: release-ref
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $ref = $env:GITHUB_SHA
          if ($tag) {
              if ($tag -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
                  throw 'Use a release tag such as 0.1.0.'
              }
              if ($env:GITHUB_EVENT_NAME -eq 'release' -and $env:GITHUB_REF -cne "refs/tags/$tag") {
                  throw 'The release event must reference the published tag.'
              }
              $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
              $release = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
              if ($release.draft -or $release.prerelease -or $release.tag_name -cne $tag) {
                  throw 'The tag must have a published, regular GitHub release.'
              }
              if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $ref = "refs/tags/$tag" }
          }
          "ref=$ref" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ steps.release-ref.outputs.ref }}
      - id: target
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          $version = ((Get-Content gradle.metadata.properties | Where-Object { $_ -match '^version=' }) -split '=', 2)[1].Trim()
          $tag = $env:RELEASE_TAG
          if ($tag -and $tag -cne $version) { throw "Release tag '$tag' must match library version '$version'." }
          # The original 0.1.0 checkout expects a v-prefixed validator argument.
          ./tests/build_configuration/verify_release_metadata.ps1 -Release -Tag "v$version"
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -or $sha -notmatch '^[a-f0-9]{40}$') { throw 'Cannot pin the checked-out commit.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Find successful full verification for this commit
        id: verification
        if: steps.target.outputs.tag != ''
        shell: pwsh
        env:
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $actions = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $workflow = "$actions/workflows/release-verification.yml/runs"
          $query = "head_sha=$env:RELEASE_SHA&event=workflow_dispatch&status=success&per_page=10"
          try {
              $runs = Invoke-RestMethod -Uri "${workflow}?$query" -Headers $headers -TimeoutSec 20
          } catch {
              Write-Warning 'Could not look up full verification. Both suites will run for this release.'
              return
          }
          $verified = $runs.workflow_runs | Where-Object {
              $_.head_sha -ceq $env:RELEASE_SHA -and
              $_.head_repository.id -eq $env:GITHUB_REPOSITORY_ID -and
              $_.event -ceq 'workflow_dispatch' -and
              $_.status -ceq 'completed' -and $_.conclusion -ceq 'success'
          } | Select-Object -First 1
          # The original 0.1.0 release completed full verification before its bundle job
          # rejected the bare tag. Recover those checks only for that published commit.
          if (!$verified -and $env:RELEASE_TAG -ceq '0.1.0' -and
              $env:RELEASE_SHA -ceq 'c8dba9c0d2ff4cc7dadcc3cc601dd9c3c5ade217') {
              try {
                  $prior = Invoke-RestMethod -Uri "$actions/runs/44533431643" -Headers $headers -TimeoutSec 20
                  if ($prior.head_sha -ceq $env:RELEASE_SHA -and
                      $prior.head_repository.id -eq $env:GITHUB_REPOSITORY_ID -and
                      $prior.event -ceq 'release' -and $prior.head_branch -ceq $env:RELEASE_TAG -and
                      $prior.status -ceq 'completed') {
                      $required = @(
                          'source / Windows JDK headers'
                          'source / Linux, Android, web and Windows cross-build'
                          'source / Actual Windows JVM and Native runtime'
                          'source / Apple (macos-26)'
                          'source / Apple (macos-26-intel)'
                          'candidate / Build and consume unsigned Maven artifacts'
                          'candidate / Apple Maven candidate (macos-26)'
                          'candidate / Apple Maven candidate (macos-26-intel)'
                      )
                      $jobs = Invoke-RestMethod -Uri "$actions/runs/$($prior.id)/attempts/$($prior.run_attempt)/jobs?per_page=50" -Headers $headers -TimeoutSec 20
                      $passed = @($jobs.jobs | Where-Object { $_.status -ceq 'completed' -and $_.conclusion -ceq 'success' } | Select-Object -ExpandProperty name)
                      $missing = @($required | Where-Object { $_ -cnotin $passed })
                      if ($missing.Count -eq 0) { $verified = $prior }
                  }
              } catch {
                  Write-Warning 'Could not confirm prior 0.1.0 checks. Both suites will run.'
              }
          }
          if ($verified.id -match '^[0-9]+$') {
              "run_id=$($verified.id)" >> $env:GITHUB_OUTPUT
              "Reusing full release verification: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$($verified.id)" >> $env:GITHUB_STEP_SUMMARY
          } else {
              Write-Host 'No matching successful full verification. Both suites will run for this release.'
          }

  source:
    needs: resolve
    if: needs.resolve.outputs.tag != '' && needs.resolve.outputs.verified_run == ''
    uses: ./.github/workflows/verify.yml
    with:
      full_apple: true
      checkout_sha: ${{ needs.resolve.outputs.sha }}

  candidate:
    needs: resolve
    if: needs.resolve.outputs.tag != '' && needs.resolve.outputs.verified_run == ''
    uses: ./.github/workflows/candidate.yml
    with:
      checkout_sha: ${{ needs.resolve.outputs.sha }}

  bundle:
    needs: [resolve, source, candidate]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' &&
          (needs.resolve.outputs.tag == '' ||
           needs.resolve.outputs.verified_run != '' ||
           (needs.source.result == 'success' && needs.candidate.result == 'success')) }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: ${{ needs.resolve.outputs.tag != '' && 'maven-central' || 'maven-preview' }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      PARIKT_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true
      - name: Prepare publication SDKs
        shell: pwsh
        run: |
          xcodebuild -version
          if ($LASTEXITCODE) { throw 'Configured Xcode is unavailable.' }
          if (!$env:ANDROID_HOME) { throw 'ANDROID_HOME is required.' }
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME/cmdline-tools" -Recurse -File -Filter sdkmanager |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (!$sdkManager) { throw 'Android SDK manager is unavailable.' }
          & $sdkManager.FullName 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE) { throw 'Android SDK installation failed.' }
          [IO.File]::WriteAllText('publishing/local.properties', "sdk.dir=$env:ANDROID_HOME`n")
      - name: Publish every coordinate and validate the bundle
        shell: pwsh
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $repo = Join-Path $PWD 'build/central/repository'
          $zip = Join-Path $PWD 'build/central/parikt-central.zip'
          if (!$env:RELEASE_TAG) {
              if (!(Get-Command gpg -ErrorAction SilentlyContinue)) {
                  brew install gnupg
                  if ($LASTEXITCODE) { throw 'Could not install GnuPG for preview signing.' }
              }
              $signingDirectory = Join-Path $env:RUNNER_TEMP 'parikt-preview-signing'
              New-Item -ItemType Directory $signingDirectory | Out-Null
              chmod 700 $signingDirectory
              $passphrase = 'parikt-disposable-preview-key'
              gpg --homedir $signingDirectory --batch --pinentry-mode loopback --passphrase $passphrase --quick-generate-key 'PariKt Preview <preview@example.invalid>' ed25519 sign 1d
              if ($LASTEXITCODE) { throw 'Could not create a disposable preview key.' }
              $key = (gpg --homedir $signingDirectory --batch --pinentry-mode loopback --passphrase $passphrase --armor --export-secret-keys) -join "`n"
              if ($LASTEXITCODE -or !$key.StartsWith('-----BEGIN PGP PRIVATE KEY BLOCK-----')) { throw 'Could not export the preview key.' }
              $env:ORG_GRADLE_PROJECT_signingInMemoryKey = $key
              $env:ORG_GRADLE_PROJECT_signingInMemoryKeyPassword = $passphrase
              $env:ORG_GRADLE_PROJECT_signingInMemoryKeyId = $null
          } elseif (!$env:ORG_GRADLE_PROJECT_signingInMemoryKey) {
              throw 'Set GPG_SIGNING_KEY in the maven-central environment.'
          }
          ./publishing/gradle.ps1 :library:publishAllPublicationsToCandidateRepository :engineTools:publishAllPublicationsToCandidateRepository "-Pparikt.candidateRepository=$repo" '-Pparikt.release.signing=true'
          if (!$env:RELEASE_TAG) {
              $signatures = @(Get-ChildItem -LiteralPath $repo -Recurse -Filter '*.asc' -File)
              foreach ($signature in $signatures) {
                  $payload = $signature.FullName.Substring(0, $signature.FullName.Length - 4)
                  gpg --homedir $signingDirectory --batch --quiet --verify $signature.FullName $payload 2>&1 | Out-Null
                  if ($LASTEXITCODE) { throw "Invalid preview signature: $($signature.Name)" }
              }
              Write-Host "Verified $($signatures.Count) preview signatures."
          }
          ./tests/publication/build_central_bundle.ps1 -Repository $repo -Bundle $zip -Tag "v$env:PARIKT_RELEASE_VERSION"
      - name: Retain bundle and build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: central-bundle
          path: |
            build/central/parikt-central.zip
            build/publication-logs/*.log
          retention-days: 7
      - name: Submit signed bundle for manual Central publication
        if: needs.resolve.outputs.tag != ''
        shell: pwsh
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if (!$env:MAVEN_CENTRAL_USERNAME -or !$env:MAVEN_CENTRAL_PASSWORD) {
              throw 'Set MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD in the maven-central environment.'
          }
          $token = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:MAVEN_CENTRAL_USERNAME):$($env:MAVEN_CENTRAL_PASSWORD)"))
          $name = [Uri]::EscapeDataString("PariKt $env:PARIKT_RELEASE_VERSION")
          $uri = "https://central.sonatype.com/api/v1/publisher/upload?name=$name&publishingType=USER_MANAGED"
          $bundle = Get-Item -LiteralPath 'build/central/parikt-central.zip'
          $deployment = Invoke-RestMethod -Uri $uri -Method Post -Headers @{ Authorization = "Bearer $token" } -Form @{ bundle = $bundle }
          if ("$deployment" -notmatch '^[0-9a-fA-F-]{36}$') { throw 'Central did not return a deployment ID.' }
          "Submitted Central deployment $deployment. Review it at https://central.sonatype.com/publishing/deployments." >> $env:GITHUB_STEP_SUMMARY
