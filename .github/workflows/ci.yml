name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v*']
  workflow_dispatch:
    inputs:
      full_apple:
        description: Run mobile simulators and link every Apple framework/test binary
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      full_apple: ${{ startsWith(github.ref, 'refs/tags/') || inputs.full_apple == true }}
